name: Site CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Static site checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: node --check site/script.js
      - name: Validate local resources and page structure
        run: python tools/check_site.py
      - name: Test interface logic
        run: node --test tests/site.test.cjs
